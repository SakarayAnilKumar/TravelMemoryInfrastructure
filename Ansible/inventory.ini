[webservers]
web-server ansible_host=3.231.53.201 ansible_user=ec2-user ansible_ssh_private_key_file=./anil-us-east-keypair.pem

[dbservers]
db-server ansible_host=10.0.2.252 ansible_user=ec2-user ansible_ssh_private_key_file=./anil-us-east-keypair.pem

[dbservers:vars]
ansible_ssh_common_args='-o ProxyCommand="ssh -W %h:%p -q -i ./anil-us-east-keypair.pem ec2-user@3.231.53.201 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"'
