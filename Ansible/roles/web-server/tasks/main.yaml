---
# ====================================================
# Web Server Role Tasks for MERN Stack Deployment
# ====================================================

- name: Set deployment directory paths
  ansible.builtin.set_fact:
    app_dir: "/home/ec2-user/TravelMemory"
    frontend_dir: "/home/ec2-user/TravelMemory/frontend"
    backend_dir: "/home/ec2-user/TravelMemory/backend"
    web_root: "/var/www/travelmemory"

# ----------------------------------------------------
# 1. System Dependencies & Prerequisites
# ----------------------------------------------------
- name: Install Git and Nginx on RedHat/Amazon Linux
  ansible.builtin.yum:
    name:
      - git
      - nginx
    state: present
  when: ansible_os_family == "RedHat"

- name: Install Git and Nginx on Debian/Ubuntu
  ansible.builtin.apt:
    name:
      - git
      - nginx
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

# --- ADDED: Node.js setup & installation so npm is available ---
- name: Setup Node.js repository on RedHat/Amazon Linux
  ansible.builtin.shell: |
    curl -fsSL https://rpm.nodesource.com/setup_20.x | sudo bash -
  args:
    executable: /bin/bash
  when: ansible_os_family == "RedHat"

- name: Setup Node.js repository on Debian/Ubuntu
  ansible.builtin.shell: |
    curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
  args:
    executable: /bin/bash
  when: ansible_os_family == "Debian"

- name: Install Node.js and npm package
  ansible.builtin.package:
    name: nodejs
    state: present
# -------------------------------------------------------------

- name: Ensure PM2 is installed globally via npm
  ansible.builtin.npm:
    name: pm2
    global: yes

# ----------------------------------------------------
# 2. Repository Management & Permissions
# ----------------------------------------------------
- name: Clone or update the TravelMemory application repository
  ansible.builtin.git:
    repo: 'https://github.com/SakarayAnilKumar/TravelMemory.git'
    dest: "{{ app_dir }}"
    version: main
    force: yes

- name: Ensure correct file ownership for ec2-user on app directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    owner: ec2-user
    group: ec2-user
    recurse: yes

# ----------------------------------------------------
# 3. Backend Setup & PM2 Execution (Port 3001)
# ----------------------------------------------------
- name: Install backend dependencies
  ansible.builtin.npm:
    path: "{{ backend_dir }}"
    production: no
  become_user: ec2-user

- name: Ensure dotenv is configured at the top of backend index.js
  ansible.builtin.lineinfile:
    path: "{{ backend_dir }}/index.js"
    regexp: "^require\\(\\s*['\"]dotenv['\"]\\s*\\)\\s*\\.\\s*config\\(\\s*\\)\\s*;?"
    insertbefore: BOF
    line: "require('dotenv').config();"

- name: Create backend .env file explicitly
  ansible.builtin.copy:
    dest: "{{ backend_dir }}/.env"
    content: |
      PORT=3001
      MONGO_URI=mongodb://{{ private_db_ip }}:27017/travelmemory
    owner: ec2-user
    group: ec2-user
    mode: '0644'

- name: Start backend application on port 3001 using PM2 with explicit environment
  ansible.builtin.shell: |
    cd {{ backend_dir }}
    pm2 delete travelmemory-backend || true
    pm2 start index.js --name travelmemory-backend --update-env
  args:
    executable: /bin/bash
  become_user: ec2-user
  environment:
    PORT: "3001"
    MONGO_URI: "mongodb://{{ private_db_ip }}:27017/travelmemory"

# ----------------------------------------------------
# 4. Frontend Build & Web Root Deployment
# ----------------------------------------------------
- name: Install frontend dependencies
  ansible.builtin.npm:
    path: "{{ frontend_dir }}"
  become_user: ec2-user

- name: Build React frontend production bundle
  ansible.builtin.shell: |
    cd {{ frontend_dir }}
    npm run build
  args:
    executable: /bin/bash
  become_user: ec2-user

- name: Ensure Nginx web root directory exists with proper permissions
  ansible.builtin.file:
    path: "{{ web_root }}"
    state: directory
    owner: nginx
    group: nginx
    mode: '0755'

- name: Copy built frontend files to Nginx web root
  ansible.builtin.shell: |
    cp -r {{ frontend_dir }}/build/* {{ web_root }}/
  args:
    executable: /bin/bash

- name: Ensure Nginx user owns the web root files to avoid 403/13 permission errors
  ansible.builtin.file:
    path: "{{ web_root }}"
    owner: nginx
    group: nginx
    recurse: yes

# ----------------------------------------------------
# 5. Nginx Configuration & Service Management
# ----------------------------------------------------
- name: Configure Nginx virtual host for TravelMemory routing
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/travelmemory.conf
    content: |
      server {
          listen 80;
          server_name _;

          location / {
              root {{ web_root }};
              try_files $uri $uri/ /index.html;
          }

          location /api/ {
              proxy_pass http://localhost:3001/;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection 'upgrade';
              proxy_set_header Host $host;
              proxy_cache_bypass $http_upgrade;
          }
      }

- name: Test Nginx configuration syntax
  ansible.builtin.command: nginx -t

- name: Ensure Nginx service is running and enabled on boot
  ansible.builtin.service:
    name: nginx
    state: restarted
    enabled: yes

- name: Save PM2 process list to persist across reboots
  ansible.builtin.shell: pm2 save
  args:
    executable: /bin/bash
  become_user: ec2-user