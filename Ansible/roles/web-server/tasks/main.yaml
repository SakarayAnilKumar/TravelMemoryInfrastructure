---
- name: Install Git, Nginx, and development tools via DNF
  ansible.builtin.dnf:
    name:
      - git
      - nginx
      - "@development"
    state: present

- name: Download Node.js 20 setup script
  ansible.builtin.get_url:
    url: https://rpm.nodesource.com/setup_20.x
    dest: /tmp/nodesource_setup.sh
    mode: '0755'

- name: Run Node.js 20 setup script
  ansible.builtin.command: bash /tmp/nodesource_setup.sh
  args:
    creates: /etc/yum.repos.d/nodesource-el9.repo

- name: Install Node.js
  ansible.builtin.dnf:
    name: nodejs
    state: present

- name: Install PM2 globally for backend process management
  community.general.npm:
    name: pm2
    global: true

- name: Clone TravelMemory repository
  ansible.builtin.git:
    repo: 'https://github.com/SakarayAnilKumar/TravelMemory.git'
    dest: /home/ec2-user/TravelMemory
    version: main
    force: yes

- name: Install npm dependencies for backend
  community.general.npm:
    path: /home/ec2-user/TravelMemory/backend

- name: Install npm dependencies for frontend
  community.general.npm:
    path: /home/ec2-user/TravelMemory/frontend

- name: Create production environment file for backend
  ansible.builtin.copy:
    dest: /home/ec2-user/TravelMemory/backend/.env
    mode: '0644'
    content: |
      PORT=3001
      MONGO_URI=mongodb://10.0.2.171:27017/travelmemory

- name: Create production environment file for frontend
  ansible.builtin.copy:
    dest: /home/ec2-user/TravelMemory/frontend/.env
    mode: '0644'
    content: |
      REACT_APP_BACKEND_URL=http://localhost:3001 # Or your public IP/blank depending on your React code

- name: Build frontend for production
  ansible.builtin.command:
    cmd: npm run build
  args:
    chdir: /home/ec2-user/TravelMemory/frontend
    creates: /home/ec2-user/TravelMemory/frontend/build

- name: Start backend application with PM2
  ansible.builtin.command:
    cmd: pm2 start index.js --name "travelmemory-backend"
  args:
    chdir: /home/ec2-user/TravelMemory/backend
    creates: /root/.pm2/pids/travelmemory-backend-0.pid

- name: Enable and start Nginx web server
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true

- name: Create web root directory for frontend
  ansible.builtin.file:
    path: /var/www/travelmemory
    state: directory
    owner: nginx
    group: nginx
    mode: '0755'

- name: Copy frontend build files to standard web root
  ansible.builtin.shell: |
    cp -r /home/ec2-user/TravelMemory/frontend/build/* /var/www/travelmemory/
    chown -R nginx:nginx /var/www/travelmemory

- name: Deploy custom Nginx configuration for TravelMemory
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/travelmemory.conf
    mode: '0644'
    content: |
      server {
          listen 80;
          server_name _;

          location / {
              root /var/www/travelmemory;
              index index.html index.htm;
              try_files $uri $uri/ /index.html;
          }

          location /api {
              proxy_pass http://localhost:5000;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection 'upgrade';
              proxy_set_header Host $host;
              proxy_cache_bypass $http_upgrade;
          }
      }

- name: Remove default Nginx conflicting config
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent

- name: Restart Nginx to load TravelMemory site
  ansible.builtin.systemd:
    name: nginx
    state: restarted
    enabled: true
